<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFS: Pro Arcade Web Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0b0f;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            border: 4px solid #222;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            background-color: #1a1a1e;
        }
        .ui-box {
            position: absolute;
            text-align: center;
            background: rgba(18, 18, 25, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            width: 420px;
            border: 1px solid #333;
        }
        h1 { color: #ff3333; margin-top: 0; font-size: 28px; text-shadow: 0 0 10px rgba(255,50,50,0.5); }
        h2 { color: #ffcc00; font-size: 22px; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #444;
            background: #15151a;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #0096ff; }
        button {
            background: #0096ff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #007acc; transform: scale(1.02); }
        .sifre-alani { position: relative; }
        .sifre-alani span { position: absolute; right: 15px; top: 18px; cursor: pointer; font-size: 14px; color: #888; }
        .kisi-secim-container { display: flex; justify-content: space-between; margin: 15px 0; }
        .kisi-btn { width: 18%; padding: 10px 0; background: #222; border: 2px solid #444; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; }
        .kisi-btn.aktif { background: #50ff64; color: black; border-color: #50ff64; }
        
        #touch-controls {
            position: absolute;
            bottom: 20px;
            display: none;
            width: 450px;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .touch-btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            font-size: 24px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .touch-btn:active { background: rgba(255, 255, 255, 0.5); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="ui-overlay" class="ui-box">
        <div id="icerik"></div>
    </div>

    <canvas id="oyunEkrani" width="450" height="650" class="hidden"></canvas>

    <div id="touch-controls">
        <div>
            <button class="touch-btn" id="btn-sol">◀</button>
            <button class="touch-btn" id="btn-fren" style="margin-top: 10px; background: rgba(255,50,50,0.3);">F</button>
        </div>
        <button class="touch-btn" id="btn-sag">▶</button>
    </div>

<script>
    const canvas = document.getElementById("oyunEkrani");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("ui-overlay");
    const icerik = document.getElementById("icerik");
    const touchControls = document.getElementById("touch-controls");

    let isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    let kullanici = localStorage.getItem("nfs_aktif_kullanici") || "";
    let durum = kullanici ? "MENU" : "GIRIS"; 
    
    let grupKodu = "";
    let grupModu = false;
    let secilenKisiSayisi = 3;
    let odaBilgisi = null;
    let lobiInterval = null;

    let arabaX = 210, arabaY = 500, arabaW = 50, arabaH = 90, arabaHiz = 7;
    let engelX = 210, engelY = -250, engelHiz = 6;
    let mesafe = 0;
    let tuslar = {};

    let isikY = -200;
    let isikDurumu = "YESIL";
    let isikSayaci = 0;
    let kirmiziIhlal = false;
    let kazandiMi = false;

    window.addEventListener("keydown", e => tuslar[e.key.toLowerCase()] = true);
    window.addEventListener("keyup", e => tuslar[e.key.toLowerCase()] = false);

    function ekranGuncelle() {
        if (lobiInterval) { clearInterval(lobiInterval); lobiInterval = null; }

        if (durum === "GIRIS") {
            overlay.classList.remove("hidden");
            canvas.classList.add("hidden");
            touchControls.style.display = "none";
            icerik.innerHTML = `
                <h1>NFS: PRO ARCADE</h1>
                <h2>GİRİŞ YAP</h2>
                <input type="text" id="kAdi" placeholder="Kullanıcı Adı">
                <div class="sifre-alani">
                    <input type="password" id="sifre" placeholder="Şifre">
                    <span onclick="sifreGosterGizle()">👁️</span>
                </div>
                <button onclick="girisYap()">GİRİŞ YAP</button>
                <button onclick="durum='KAYIT'; ekranGuncelle();" style="background:#333; font-size:14px;">Hesabın yok mu? Kayıt Ol</button>
            `;
        } else if (durum === "KAYIT") {
            overlay.classList.remove("hidden");
            canvas.classList.add("hidden");
            touchControls.style.display = "none";
            icerik.innerHTML = `
                <h1>NFS: PRO ARCADE</h1>
                <h2>KAYIT OL</h2>
                <input type="text" id="kAdi" placeholder="Yeni Kullanıcı Adı">
                <div class="sifre-alani">
                    <input type="password" id="sifre" placeholder="Şifre Belirle">
                    <span onclick="sifreGosterGizle()">👁️</span>
                </div>
                <button onclick="kayitOl()" style="background:#50ff64; color:black;">KAYIT OL VE GİRİŞ YAP</button>
                <button onclick="durum='GIRIS'; ekranGuncelle();" style="background:#333; font-size:14px;">Zaten hesabın var mı? Giriş Yap</button>
            `;
        } else if (durum === "MENU") {
            overlay.classList.remove("hidden");
            canvas.classList.add("hidden");
            touchControls.style.display = "none";
            icerik.innerHTML = `
                <h1>NFS: PRO ARCADE</h1>
                <p style="color:#50ff64; font-weight:bold;">Pilot: ${kullanici}</p>
                <button onclick="oyunBaslat(false)">TEK OYUNCULU OYNA</button>
                <button onclick="durum='GRUP_KUR'; ekranGuncelle();" style="background: #8c32ff;">GURUP KUR (ÇOK OYUNCU)</button>
                <button onclick="durum='GRUP_KATIL'; ekranGuncelle();" style="background: #ffcc00; color:black;">GRUBA KATIL</button>
                <button onclick="cikisYap()" style="background: #ff3333; margin-top:20px; font-size:13px;">HESAPTAN ÇIKIŞ YAP</button>
            `;
        } else if (durum === "GRUP_KUR") {
            grupKodu = Math.floor(100000 + Math.random() * 900000).toString();
            odaBilgisi = { lider: kullanici, max: secilenKisiSayisi, mevcut: 1, durum: "bekliyor" };
            localStorage.setItem("nfs_oda_" + grupKodu, JSON.stringify(odaBilgisi));

            overlay.classList.remove("hidden");
            canvas.classList.add("hidden");
            
            function liderLobiUI() {
                let guncel = JSON.parse(localStorage.getItem("nfs_oda_" + grupKodu));
                if (guncel) {
                    odaBilgisi = guncel;
                    // Eğer oyuncu sayısı tamamlandıysa veya lider başlat tuşuna bastıysa ve kontenjan dolduysa
                    if (guncel.durum === "basladi") {
                        oyunBaslat(true);
                        return;
                    }
                }
                icerik.innerHTML = `
                    <h1>GRUP OLUŞTURULDU</h1>
                    <p>Grup Kodun: <span style="color:#ffcc00; font-size:20px; font-weight:bold;">${grupKodu}</span></p>
                    <p style="font-size:14px; color:#aaa;">Yarışmacı Sayısı Seç (2 - 5):</p>
                    <div class="kisi-secim-container">
                        <button class="kisi-btn ${secilenKisiSayisi===2?'aktif':''}" onclick="kisiSec(2)">2</button>
                        <button class="kisi-btn ${secilenKisiSayisi===3?'aktif':''}" onclick="kisiSec(3)">3</button>
                        <button class="kisi-btn ${secilenKisiSayisi===4?'aktif':''}" onclick="kisiSec(4)">4</button>
                        <button class="kisi-btn ${secilenKisiSayisi===5?'aktif':''}" onclick="kisiSec(5)">5</button>
                    </div>
                    <p style="font-size:15px; color:#ffcc00; margin:15px 0;">Oyuncular Bekleniyor: <b>${odaBilgisi.mevcut} / ${secilenKisiSayisi}</b></p>
                    <p style="font-size:12px; color:#888;">Seçilen kişi sayısı dolunca yarış otomatik başlayacaktır.</p>
                    <button onclick="durum='MENU'; ekranGuncelle();" style="background: #444;">Geri / İptal</button>
                `;
            }
            liderLobiUI();
            lobiInterval = setInterval(liderLobiUI, 1000);

        } else if (durum === "GRUP_KATIL") {
            overlay.classList.remove("hidden");
            canvas.classList.add("hidden");
            icerik.innerHTML = `
                <h1>GRUBA KATIL</h1>
                <input type="text" id="kodInput" placeholder="6 Haneli Grup Kodu" maxlength="6" style="text-align:center; font-size:22px; letter-spacing:3px;">
                <button onclick="kodBaglan()" style="background: #ffcc00; color:black;">BAĞLAN</button>
                <button onclick="durum='MENU'; ekranGuncelle();" style="background: #444;">Geri</button>
            `;
        } else if (durum === "LOBI") {
            overlay.classList.remove("hidden");
            canvas.classList.add("hidden");
            
            function katilimciLobiUI() {
                let guncelOda = JSON.parse(localStorage.getItem("nfs_oda_" + grupKodu));
                if (guncelOda) {
                    odaBilgisi = guncelOda;
                    if (guncelOda.durum === "basladi") {
                        oyunBaslat(true);
                        return;
                    }
                }
                icerik.innerHTML = `
                    <h1>LOBİ BEKLEME ODASI</h1>
                    <p>Grup Kodu: <span style="color:#ffcc00;">${grupKodu}</span></p>
                    <p style="color:#50ff64; font-size:16px; margin: 20px 0;">Odaya katıldın!<br>Oyuncular Bekleniyor: <b>${odaBilgisi ? odaBilgisi.mevcut : 1} / ${odaBilgisi ? odaBilgisi.max : 2}</b></p>
                    <p style="font-size:12px; color:#888;">Grup tamamlandığında yarış otomatik başlayacak.</p>
                    <button onclick="durum='MENU'; ekranGuncelle();" style="background: #444;">Ayrıl</button>
                `;
            }
            katilimciLobiUI();
            lobiInterval = setInterval(katilimciLobiUI, 1000);
        }
    }

    function kisiSec(sayi) {
        secilenKisiSayisi = sayi;
        if(odaBilgisi) {
            odaBilgisi.max = sayi;
            localStorage.setItem("nfs_oda_" + grupKodu, JSON.stringify(odaBilgisi));
        }
        ekranGuncelle();
    }

    function kodBaglan() {
        let kod = document.getElementById("kodInput").value.trim();
        let kayitliOda = localStorage.getItem("nfs_oda_" + kod);
        
        if(kod.length === 6 && kayitliOda) {
            grupKodu = kod;
            odaBilgisi = JSON.parse(kayitliOda);
            
            if (odaBilgisi.durum === "bekliyor") {
                if (odaBilgisi.mevcut < odaBilgisi.max) {
                    odaBilgisi.mevcut++;
                    // Eğer son oyuncu da katıldıysa oda durumunu otomatik "basladi" yap!
                    if (odaBilgisi.mevcut >= odaBilgisi.max) {
                        odaBilgisi.durum = "basladi";
                    }
                    localStorage.setItem("nfs_oda_" + kod, JSON.stringify(odaBilgisi));
                } else {
                    alert("Bu oda zaten dolu!");
                    return;
                }
            }
            durum = "LOBI";
            ekranGuncelle();
        } else {
            alert("Böyle bir grup yok!");
        }
    }

    // Lider için de kişi sayısı dolunca otomatik başlatma kontrolü (Lobi döngüsü içinde)
    setInterval(() => {
        if (durum === "GRUP_KUR" && odaBilgisi) {
            if (odaBilgisi.mevcut >= odaBilgisi.max && odaBilgisi.durum !== "basladi") {
                odaBilgisi.durum = "basladi";
                localStorage.setItem("nfs_oda_" + grupKodu, JSON.stringify(odaBilgisi));
                oyunBaslat(true);
            }
        }
    }, 1000);

    function sifreGosterGizle() {
        let input = document.getElementById("sifre");
        input.type = input.type === "password" ? "text" : "password";
    }

    function kayitOl() {
        let k = document.getElementById("kAdi").value.trim();
        let s = document.getElementById("sifre").value.trim();
        if(k && s) {
            localStorage.setItem("nfs_user_" + k, s);
            localStorage.setItem("nfs_aktif_kullanici", k);
            kullanici = k;
            durum = "MENU";
            ekranGuncelle();
        } else {
            alert("Lütfen tüm alanları doldur!");
        }
    }

    function girisYap() {
        let k = document.getElementById("kAdi").value.trim();
        let s = document.getElementById("sifre").value.trim();
        let kayitliSifre = localStorage.getItem("nfs_user_" + k);
        if(kayitliSifre && kayitliSifre === s) {
            localStorage.setItem("nfs_aktif_kullanici", k);
            kullanici = k;
            durum = "MENU";
            ekranGuncelle();
        } else {
            alert("Kullanıcı adı veya şifre hatalı / kayıtlı değil!");
        }
    }

    function cikisYap() {
        localStorage.removeItem("nfs_aktif_kullanici");
        kullanici = "";
        durum = "GIRIS";
        ekranGuncelle();
    }

    function oyunBaslat(grupM) {
        if (lobiInterval) { clearInterval(lobiInterval); lobiInterval = null; }
        grupModu = grupM;
        durum = "OYUN";
        overlay.classList.add("hidden");
        canvas.classList.remove("hidden");
        
        if (isTouchDevice) {
            touchControls.style.display = "flex";
        }

        arabaX = 210;
        arabaY = 500;
        engelY = -250;
        mesafe = 0;
        kirmiziIhlal = false;
        kazandiMi = false;
        isikY = -400;
        isikDurumu = "YESIL";
        engelX = [110, 210, 310][Math.floor(Math.random()*3)];
    }

    function setupTouchButton(id, keyName) {
        const btn = document.getElementById(id);
        if(!btn) return;
        btn.addEventListener("touchstart", (e) => { e.preventDefault(); tuslar[keyName] = true; });
        btn.addEventListener("touchend", (e) => { e.preventDefault(); tuslar[keyName] = false; });
        btn.addEventListener("mousedown", () => tuslar[keyName] = true);
        btn.addEventListener("mouseup", () => tuslar[keyName] = false);
    }
    setupTouchButton("btn-sol", "arrowleft");
    setupTouchButton("btn-sag", "arrowright");
    setupTouchButton("btn-fren", "s");

    function arabaCiz(x, y, govdeRengi, isim) {
        ctx.fillStyle = govdeRengi;
        ctx.beginPath();
        ctx.roundRect(x, y, 50, 90, 10);
        ctx.fill();

        ctx.fillStyle = "#111";
        ctx.fillRect(x + 8, y + 22, 34, 20);
        ctx.fillRect(x + 10, y + 55, 30, 15);

        ctx.fillStyle = "#ffcc00";
        ctx.fillRect(x + 5, y + 3, 8, 4);
        ctx.fillRect(x + 37, y + 3, 8, 4);

        if (isim) {
            ctx.fillStyle = "white";
            ctx.font = "bold 13px Arial";
            ctx.textAlign = "center";
            ctx.fillText(isim, x + 25, y - 12);
            ctx.textAlign = "left";
        }
    }

    function guncelle() {
        if (durum === "OYUN") {
            let frenYapiliyor = tuslar["s"];
            let hiz = frenYapiliyor ? 0 : arabaHiz;

            if ((tuslar["a"] || tuslar["arrowleft"]) && arabaX > 75) arabaX -= arabaHiz;
            if ((tuslar["d"] || tuslar["arrowright"]) && arabaX < 325) arabaX += arabaHiz;

            if (!grupModu) {
                isikSayaci++;
                if (isikSayaci > 300) {
                    isikDurumu = isikDurumu === "YESIL" ? "KIRMIZI" : "YESIL";
                    isikSayaci = 0;
                }

                isikY += engelHiz;
                if (isikY > 700) { isikY = -500; isikDurumu = "YESIL"; }

                if (isikDurumu === "KIRMIZI" && Math.abs(arabaY - isikY) < 60 && arabaY > isikY && !frenYapiliyor) {
                    kirmiziIhlal = true;
                    durum = "BITTI";
                    touchControls.style.display = "none";
                }

                engelY += engelHiz;
                if (engelY > 650) {
                    engelY = -250;
                    engelX = [110, 210, 310][Math.floor(Math.random()*3)];
                    mesafe += 25;
                }

                if (arabaX < engelX + 50 && arabaX + arabaW > engelX && arabaY < engelY + 90 && arabaY + arabaH > engelY) {
                    kirmiziIhlal = false;
                    durum = "BITTI";
                    touchControls.style.display = "none";
                }
            } else {
                mesafe += hiz > 0 ? 35 : 0;
                if (mesafe >= 1000) {
                    kazandiMi = true;
                    durum = "BITTI";
                    touchControls.style.display = "none";
                }
            }
        }
    }

    function ciz() {
        ctx.fillStyle = "#2c2c32";
        ctx.fillRect(0, 0, 450, 650);

        ctx.fillStyle = "#1c1c20";
        ctx.fillRect(40, 0, 15, 650);
        ctx.fillRect(395, 0, 15, 650);

        ctx.strokeStyle = "white";
        ctx.lineWidth = 4;
        ctx.setLineDash([25, 25]);
        ctx.beginPath();
        ctx.moveTo(180, 0); ctx.lineTo(180, 650);
        ctx.moveTo(270, 0); ctx.lineTo(270, 650);
        ctx.stroke();
        ctx.setLineDash([]);

        if (durum === "OYUN") {
            if (!grupModu) {
                ctx.fillStyle = "#111";
                ctx.fillRect(320, isikY - 20, 45, 80);
                ctx.fillStyle = isikDurumu === "YESIL" ? "#50ff64" : "#441111";
                ctx.beginPath(); ctx.arc(342, isikY + 5, 12, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = isikDurumu === "KIRMIZI" ? "#ff3333" : "#224422";
                ctx.beginPath(); ctx.arc(342, isikY + 45, 12, 0, Math.PI * 2); ctx.fill();

                arabaCiz(engelX, engelY, "#ffcc00", "Rakip");
            }

            arabaCiz(arabaX, arabaY, "#ff3333", kullanici);

            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0, 0, 450, 50);
            ctx.fillStyle = "white";
            ctx.font = "bold 16px Arial";
            ctx.fillText(grupModu ? `Grup: ${grupKodu}` : "Tek Oyunculu", 20, 30);
            ctx.fillText(`Mesafe: ${mesafe}m`, 310, 30);

        } else if (durum === "BITTI") {
            ctx.fillStyle = "rgba(0,0,0,0.85)";
            ctx.fillRect(0, 0, 450, 650);
            
            ctx.fillStyle = "white";
            ctx.font = "bold 32px Arial";
            ctx.textAlign = "center";
            
            if (kazandiMi) {
                ctx.fillStyle = "#50ff64";
                ctx.fillText("TEBRİKLER, 1. OLDUNUZ!", 225, 260);
            } else if (kirmiziIhlal) {
                ctx.fillStyle = "#ff3333";
                ctx.fillText("Kırmızı Işık'ı Geçtin!", 225, 260);
            } else {
                ctx.fillStyle = "#ff3333";
                ctx.fillText("KAZA YAPTIN!", 225, 260);
            }

            ctx.font = "18px Arial";
            ctx.fillStyle = "white";
            ctx.fillText("Ana Menüye Dönmek İçin Tıkla", 225, 330);
            ctx.textAlign = "left";
        }
    }

    window.addEventListener("click", () => {
        if (durum === "BITTI") {
            durum = "MENU";
            ekranGuncelle();
        }
    });

    function dongu() {
        guncelle();
        ciz();
        requestAnimationFrame(dongu);
    }

    ekranGuncelle();
    dongu();
</script>

</body>
</html>
